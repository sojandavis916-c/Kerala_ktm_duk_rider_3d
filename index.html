

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kerala KTM Duke Rider 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101820;color:white;font-family:Arial;text-align:center;overflow:hidden}
h2{margin:10px 0 4px;color:#ff6b00}
#info{display:flex;justify-content:space-around;font-size:16px;padding:8px}
canvas{display:block;margin:auto;background:#57934c;width:100vw;height:68vh;max-height:650px}
.controls{display:flex;justify-content:space-around;gap:12px;padding:10px}
button{background:#ff6b00;color:white;border:0;border-radius:12px;padding:15px 24px;font-size:20px;font-weight:bold;touch-action:none}
#start{font-size:16px;padding:10px 22px}
</style>
</head>
<body>
<h2>🏍️ KERALA KTM DUKE RIDER</h2>
<div id="info">
 <span>Score: <b id="score">0</b></span>
 <span>Speed: <b id="speed">0</b></span>
 <span>🏁 Kerala Road</span>
</div>
<canvas id="game"></canvas>
<div class="controls">
 <button id="left">⬅️</button>
 <button id="nitro">⚡ NITRO</button>
 <button id="right">➡️</button>
</div>
<button id="start">START / RESTART</button>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let W=0,H=0,player=0,score=0,speed=0,traffic=[],running=false,roadOffset=0,nitro=false;
function resize(){
 const dpr=window.devicePixelRatio||1;
 W=canvas.clientWidth; H=canvas.clientHeight;
 canvas.width=W*dpr;canvas.height=H*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize",resize);resize();
function road(){
 ctx.fillStyle="#57934c";ctx.fillRect(0,0,W,H);
 // Kerala trees and roadside
 for(let y=0;y<H;y+=65){
  let x1=W*.12+(Math.sin(y*.08+roadOffset*.01)*12);
  let x2=W*.88+(Math.sin(y*.08+roadOffset*.01)*12);
  ctx.fillStyle="#245c35";
  ctx.beginPath();ctx.arc(x1,y+20,15,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(x2,y+35,17,0,7);ctx.fill();
 }
 let rw=W*.62, left=(W-rw)/2;
 ctx.fillStyle="#444";ctx.beginPath();
 ctx.moveTo(W*.38,0);ctx.lineTo(W*.62,0);
 ctx.lineTo(W*.92,H);ctx.lineTo(W*.08,H);ctx.closePath();ctx.fill();
 ctx.strokeStyle="#fff";ctx.lineWidth=4;ctx.setLineDash([28,24]);
 ctx.lineDashOffset=-roadOffset;
 ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();
 ctx.setLineDash([]);
 ctx.strokeStyle="#f6d34a";ctx.lineWidth=5;
 ctx.beginPath();ctx.moveTo(W*.38,0);ctx.lineTo(W*.08,H);ctx.stroke();
 ctx.beginPath();ctx.moveTo(W*.62,0);ctx.lineTo(W*.92,H);ctx.stroke();
}
function bike(x,y,color,scale=1){
 ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
 ctx.fillStyle="#111";
 ctx.beginPath();ctx.ellipse(-13,15,8,18,0,0,7);ctx.fill();
 ctx.beginPath();ctx.ellipse(13,15,8,18,0,0,7);ctx.fill();
 ctx.fillStyle=color;ctx.beginPath();
 ctx.moveTo(-15,-8);ctx.lineTo(-10,-25);ctx.lineTo(10,-25);
 ctx.lineTo(16,-8);ctx.lineTo(9,15);ctx.lineTo(-9,15);ctx.closePath();ctx.fill();
 ctx.fillStyle="#eee";ctx.fillRect(-5,-29,10,5);
 ctx.fillStyle="#222";ctx.fillRect(-4,-18,8,15);
 ctx.strokeStyle="#111";ctx.lineWidth=4;
 ctx.beginPath();ctx.moveTo(-18,-20);ctx.lineTo(18,-20);ctx.stroke();
 ctx.restore();
}
function car(x,y,color){
 ctx.fillStyle="#111";ctx.fillRect(x-17,y-15,34,45);
 ctx.fillStyle=color;ctx.fillRect(x-14,y-24,28,48);
 ctx.fillStyle="#bdeaff";ctx.fillRect(x-10,y-18,20,10);
 ctx.fillStyle="#fff";ctx.fillRect(x-11,y+15,7,5);ctx.fillRect(x+4,y+15,7,5);
}
function spawn(){
 traffic.push({lane:Math.random()>.5?-.23:.23,y:-60,color:["#e33","#2299dd","#eee","#f5c542"][Math.floor(Math.random()*4)]});
}
function draw(){
 road();
 traffic.forEach(t=>{
  let x=W/2+t.lane*W+(t.y/H)*t.lane*W*.35;
  car(x,t.y,t.color);
 });
 bike(W/2+player*W*.25,H*.78,"#ff6b00",1.15);
 if(!running){
  ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="white";ctx.font="bold 26px Arial";ctx.textAlign="center";
  ctx.fillText("KERALA BIKE RACE",W/2,H*.42);
  ctx.font="17px Arial";ctx.fillText("Press START to ride!",W/2,H*.49);
 }
}
function update(){
 if(!running){draw();requestAnimationFrame(update);return}
 speed=nitro?12:7;
 roadOffset+=speed;
 score+=1;
 document.getElementById("score").textContent=score;
 document.getElementById("speed").textContent=speed*10;
 if(Math.random()<.025)spawn();
 traffic.forEach(t=>t.y+=speed*1.5);
 traffic=traffic.filter(t=>t.y<H+70);
 for(const t of traffic){
  let x=W/2+t.lane*W+(t.y/H)*t.lane*W*.35;
  if(t.y>H*.69&&t.y<H*.86&&Math.abs(x-(W/2+player*W*.25))<35){
   running=false;
   alert("🏁 Race Over! Your score: "+score);
   break;
  }
 }
 draw();requestAnimationFrame(update);
}
function moveLeft(){player=Math.max(-1,player-.18)}
function moveRight(){player=Math.min(1,player+.18)}
function hold(id,fn){
 const b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{e.preventDefault();fn(true)});
 b.addEventListener("pointerup",()=>fn(false));
 b.addEventListener("pointerleave",()=>fn(false));
}
hold("left",v=>{if(v)moveLeft()});
hold("right",v=>{if(v)moveRight()});
hold("nitro",v=>nitro=v);
document.getElementById("start").onclick=()=>{
 score=0;player=0;traffic=[];running=true;
};
window.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")moveLeft();
 if(e.key==="ArrowRight")moveRight();
 if(e.code==="Space")nitro=true;
});
window.addEventListener("keyup",e=>{if(e.code==="Space")nitro=false});
update();
</script>
</body>
</html>
